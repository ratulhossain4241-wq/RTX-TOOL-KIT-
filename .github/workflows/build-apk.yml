name: Build RTX TOOL KIT APK

# Runs on every push to main, or manually from the Actions tab.
# Builds the APK directly on GitHub's own servers using Gradle - NO Expo
# account, EXPO_TOKEN, or EAS project needed at all.
#
# After this workflow finishes, go to the Actions tab -> click this run
# -> scroll to "Artifacts" at the bottom -> download "rtx-toolkit-apk".
# Unzip it on your phone and tap the .apk file to install.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rtx-toolkit
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: rtx-toolkit/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtx-toolkit-apk
          path: rtx-toolkit/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
